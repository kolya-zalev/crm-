services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm123
      POSTGRES_DB: crm_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../crm-server
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://crm:crm123@db:5432/crm_db
      JWT_SECRET: super-long-random-secret-at-least-32-characters

  web:
    build:
      context: ../../crm-server
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
